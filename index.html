<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community MRI Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root {
    --bg: #f6f1e9;
    --ink: #1f2a2e;
    --accent: #0f5c5e;
    --accent-dark: #0a4345;
    --line: #ddd3c3;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; margin: 0; }
  header {
    position: sticky; top: 0; top: env(safe-area-inset-top, 0px);
    z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand span { font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 600; }
  nav { display: flex; align-items: center; gap: 24px; font-size: 16px; flex-wrap: wrap; }
  nav a { color: var(--ink); text-decoration: none; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 26px;
    background: var(--accent); color: #fff !important;
    border: none; border-radius: 999px;
    font-family: inherit; font-size: 16px; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .btn-outline {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 26px;
    background: transparent; color: var(--accent) !important;
    border: 2px solid var(--accent); border-radius: 999px;
    font-family: inherit; font-size: 16px; font-weight: 600;
    text-decoration: none;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 24px; }
  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    background: #1f2a2e;
  }
  .video-wrap video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .cta-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 28px; }

  .header-actions { display: flex; align-items: center; gap: 12px; }
  .menu-toggle {
    display: none;
    width: 44px; height: 44px;
    align-items: center; justify-content: center;
    background: transparent; border: 2px solid var(--ink); border-radius: 10px;
    cursor: pointer; padding: 0;
  }
  .menu-toggle svg { display: block; }

  @media (max-width: 820px) {
    header { position: relative; }
    nav#nav-links {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      order: 3;
      padding-top: 8px;
    }
    nav#nav-links a {
      width: 100%;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    nav#nav-links.open { display: flex; }
    .menu-toggle { display: inline-flex; }
  }
</style>
</head>
<body>

<header>
  <a href="#top" class="brand">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0f5c5e" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4.5"></circle></svg>
    <span>Community MRI Project</span>
  </a>
  <nav id="nav-links">
    <a href="progress.html">Progress</a>
    <a href="impact.html">Impact</a>
    <a href="about.html">About</a>
    <a href="get-involved.html">Get involved</a>
  </nav>
  <div class="header-actions">
    <a href="wobot.html" class="btn">Donate</a>
    <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </div>
</header>

<script>
  var toggle = document.getElementById('menu-toggle');
  var nav = document.getElementById('nav-links');
  toggle.addEventListener('click', function () {
    var isOpen = nav.classList.toggle('open');
    toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
</script>

<main id="top">
  <div class="video-wrap">
    <video src="CMRI.mp4" controls playsinline preload="metadata" aria-label="Community MRI Project video"></video>
  </div>
  <div class="cta-row">
    <a href="wobot.html" class="btn">Donate</a>
    <a href="get-involved.html" class="btn-outline">Volunteer</a>
  </div>
</main>

</body>
</html>
