<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community MRI Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root {
    --bg: #f6f1e9;
    --ink: #1f2a2e;
    --accent: #0f5c5e;
    --accent-dark: #0a4345;
    --line: #ddd3c3;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; margin: 0; }
  header {
    position: sticky; top: 0; top: env(safe-area-inset-top, 0px);
    z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand span { font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 600; }
  nav { display: flex; align-items: center; gap: 24px; font-size: 16px; flex-wrap: wrap; }
  nav a { color: var(--ink); text-decoration: none; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 26px;
    background: var(--accent); color: #fff !important;
    border: none; border-radius: 999px;
    font-family: inherit; font-size: 16px; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .btn-outline {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 26px;
    background: transparent; color: var(--accent) !important;
    border: 2px solid var(--accent); border-radius: 999px;
    font-family: inherit; font-size: 16px; font-weight: 600;
    text-decoration: none;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 24px; }
  .video-thumb {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    background: #1f2a2e center / cover no-repeat;
    text-decoration: none;
  }
  .video-thumb::after {
    content: "";
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.25);
  }
  .play-button {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 76px; height: 76px;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .play-button svg { margin-left: 4px; }
  .cta-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 28px; }

  @media (max-width: 820px) {
    nav a:not(.btn) { display: none; }
  }
</style>
</head>
<body>

<header>
  <a href="#top" class="brand">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0f5c5e" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4.5"></circle></svg>
    <span>Community MRI Project</span>
  </a>
  <nav>
    <a href="#progress">Progress</a>
    <a href="#impact">Impact</a>
    <a href="https://claude.ai/artifact/8KZ8N2pBbE35Am5d9UDgg4">About</a>
    <a href="#involved">Get involved</a>
    <a href="https://claude.ai/artifact/YUTry2agaGxMPwnCzepy53" class="btn">Donate</a>
  </nav>
</header>

<main id="top">
  <a href="https://www.youtube.com/watch?v=2rxq4aDvOzU" target="_blank" rel="noopener noreferrer" class="video-thumb" style="background-image: url('https://img.youtube.com/vi/2rxq4aDvOzU/maxresdefault.jpg');" aria-label="Play video on YouTube">
    <span class="play-button">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#1f2a2e" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </span>
  </a>
  <div class="cta-row">
    <a href="https://claude.ai/artifact/YUTry2agaGxMPwnCzepy53" class="btn">Donate</a>
    <a href="#involved" class="btn-outline">Volunteer</a>
  </div>
</main>

</body>
</html>
